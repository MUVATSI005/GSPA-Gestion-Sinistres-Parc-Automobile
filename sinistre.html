<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sinistres — GSPA</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <script src="js/app.js"></script>
  <script>
    const session = setupLayout('sinistre.html', 'Gestion des sinistres');
    if (!session) throw new Error('Non authentifié');

    const isConducteur = session.privilege === 'conducteur';
    let editId = null;
    let filterStatut = '';

    function getFilteredClaims() {
      let claims = getClaims();
      if (isConducteur) {
        claims = claims.filter(c => c.conducteurId === session.id);
      }
      if (filterStatut) {
        claims = claims.filter(c => c.statut === filterStatut);
      }
      return claims.sort((a, b) => (b.dateSinistre || '').localeCompare(a.dateSinistre || ''));
    }

    function renderClaims() {
      const claims = getFilteredClaims();
      const vehicles = getVehicles();
      const drivers = getUsers().filter(u => u.privilege === 'conducteur');

      let vehicleOpts = vehicles;
      if (isConducteur) {
        vehicleOpts = vehicles.filter(v => v.conducteurId === session.id);
      }

      const rows = claims.map(c => `
        <tr>
          <td><strong>${c.numero}</strong></td>
          <td>${formatDate(c.dateSinistre)}</td>
          <td>${getVehicleLabel(c.vehiculeId)}</td>
          <td>${isConducteur ? '' : getConducteurName(c.conducteurId)}</td>
          <td>${c.type}</td>
          <td>${c.gravite || '—'}</td>
          <td>${statutBadge(c.statut)}</td>
          <td>${c.coutEstime ? c.coutEstime.toLocaleString('fr-FR') + ' €' : '—'}</td>
          <td class="actions-cell">
            <button class="btn btn-outline btn-sm" onclick="openView('${c.id}')">Détail</button>
            ${!isConducteur || c.statut === 'declare' ? `<button class="btn btn-outline btn-sm" onclick="openEdit('${c.id}')">Modifier</button>` : ''}
            ${session.privilege === 'admin' ? `<button class="btn btn-danger btn-sm" onclick="confirmDelete('${c.id}', '${c.numero}')">Suppr.</button>` : ''}
          </td>
        </tr>
      `).join('') || `<tr><td colspan="9" style="text-align:center;padding:32px" class="text-muted">Aucun sinistre trouvé</td></tr>`;

      const thConducteur = isConducteur ? '' : '<th>Conducteur</th>';

      document.getElementById('page-content').innerHTML = `
        <div class="card">
          <div class="card-header">
            <h2>Sinistres (${claims.length})</h2>
            <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
              <select id="filter-statut" style="padding:8px 12px;border-radius:8px;border:1.5px solid var(--border)">
                <option value="">Tous les statuts</option>
                <option value="declare">Déclaré</option>
                <option value="en_cours">En cours</option>
                <option value="cloture">Clôturé</option>
                <option value="refuse">Refusé</option>
              </select>
              <button class="btn btn-primary btn-sm" onclick="openAdd()">+ Déclarer un sinistre</button>
            </div>
          </div>
          <div class="card-body" style="padding:0">
            <div class="table-responsive">
              <table>
                <thead>
                  <tr>
                    <th>N°</th>
                    <th>Date</th>
                    <th>Véhicule</th>
                    ${thConducteur}
                    <th>Type</th>
                    <th>Gravité</th>
                    <th>Statut</th>
                    <th>Coût est.</th>
                    <th>Actions</th>
                  </tr>
                </thead>
                <tbody>${rows}</tbody>
              </table>
            </div>
          </div>
        </div>

        <div class="modal-overlay" id="claim-modal">
          <div class="modal" style="max-width:560px">
            <div class="modal-header">
              <h3 id="modal-title">Déclarer un sinistre</h3>
              <button class="modal-close" onclick="closeModal('claim-modal')">&times;</button>
            </div>
            <form id="claim-form">
              <div class="modal-body">
                <div class="form-row">
                  <div class="form-group">
                    <label for="dateSinistre">Date du sinistre *</label>
                    <input type="date" id="dateSinistre" required>
                  </div>
                  <div class="form-group">
                    <label for="type">Type *</label>
                    <select id="type" required>
                      <option value="Collision">Collision</option>
                      <option value="Bris de glace">Bris de glace</option>
                      <option value="Stationnement">Stationnement</option>
                      <option value="Vol">Vol</option>
                      <option value="Incendie">Incendie</option>
                      <option value="Catastrophe naturelle">Catastrophe naturelle</option>
                      <option value="Autre">Autre</option>
                    </select>
                  </div>
                </div>
                <div class="form-group">
                  <label for="vehiculeId">Véhicule *</label>
                  <select id="vehiculeId" required>
                    <option value="">— Sélectionner —</option>
                    ${vehicleOpts.map(v => `<option value="${v.id}">${v.immatriculation} — ${v.marque} ${v.modele}</option>`).join('')}
                  </select>
                </div>
                ${!isConducteur ? `
                <div class="form-group">
                  <label for="conducteurId">Conducteur *</label>
                  <select id="conducteurId" required>
                    <option value="">— Sélectionner —</option>
                    ${drivers.map(d => `<option value="${d.id}">${d.prenom} ${d.nom}</option>`).join('')}
                  </select>
                </div>` : '<input type="hidden" id="conducteurId" value="' + session.id + '">'}
                <div class="form-group">
                  <label for="lieu">Lieu *</label>
                  <input type="text" id="lieu" required placeholder="Adresse ou lieu de l\'incident">
                </div>
                <div class="form-group">
                  <label for="description">Description *</label>
                  <textarea id="description" rows="3" required placeholder="Décrivez les circonstances et les dégâts..."></textarea>
                </div>
                <div class="form-row">
                  <div class="form-group">
                    <label for="gravite">Gravité *</label>
                    <select id="gravite" required>
                      <option value="légère">Légère</option>
                      <option value="moyenne">Moyenne</option>
                      <option value="grave">Grave</option>
                    </select>
                  </div>
                  <div class="form-group">
                    <label for="coutEstime">Coût estimé (€)</label>
                    <input type="number" id="coutEstime" min="0" step="10">
                  </div>
                </div>
                ${!isConducteur ? `
                <div class="form-group">
                  <label for="statut">Statut</label>
                  <select id="statut">
                    <option value="declare">Déclaré</option>
                    <option value="en_cours">En cours</option>
                    <option value="cloture">Clôturé</option>
                    <option value="refuse">Refusé</option>
                  </select>
                </div>
                <div class="form-group">
                  <label for="observations">Observations internes</label>
                  <textarea id="observations" rows="2"></textarea>
                </div>` : ''}
              </div>
              <div class="modal-footer">
                <button type="button" class="btn btn-outline" onclick="closeModal('claim-modal')">Annuler</button>
                <button type="submit" class="btn btn-primary">Enregistrer</button>
              </div>
            </form>
          </div>
        </div>

        <div class="modal-overlay" id="view-modal">
          <div class="modal" style="max-width:520px">
            <div class="modal-header">
              <h3 id="view-title">Détail du sinistre</h3>
              <button class="modal-close" onclick="closeModal('view-modal')">&times;</button>
            </div>
            <div class="modal-body" id="view-body"></div>
            <div class="modal-footer">
              <button type="button" class="btn btn-outline" onclick="closeModal('view-modal')">Fermer</button>
            </div>
          </div>
        </div>
      `;

      document.getElementById('filter-statut').value = filterStatut;
      document.getElementById('filter-statut').addEventListener('change', function () {
        filterStatut = this.value;
        renderClaims();
      });

      document.getElementById('claim-form').addEventListener('submit', handleSubmit);
    }

    function openAdd() {
      editId = null;
      document.getElementById('modal-title').textContent = 'Déclarer un sinistre';
      document.getElementById('claim-form').reset();
      document.getElementById('dateSinistre').value = new Date().toISOString().slice(0, 10);
      if (isConducteur) {
        document.getElementById('conducteurId').value = session.id;
      }
      openModal('claim-modal');
    }

    function openEdit(id) {
      const c = getClaimById(id);
      if (!c) return;
      editId = id;
      document.getElementById('modal-title').textContent = 'Modifier le sinistre ' + c.numero;
      document.getElementById('dateSinistre').value = c.dateSinistre || '';
      document.getElementById('type').value = c.type || 'Collision';
      document.getElementById('vehiculeId').value = c.vehiculeId || '';
      document.getElementById('conducteurId').value = c.conducteurId || '';
      document.getElementById('lieu').value = c.lieu || '';
      document.getElementById('description').value = c.description || '';
      document.getElementById('gravite').value = c.gravite || 'légère';
      document.getElementById('coutEstime').value = c.coutEstime || '';
      const statutEl = document.getElementById('statut');
      if (statutEl) statutEl.value = c.statut || 'declare';
      const obsEl = document.getElementById('observations');
      if (obsEl) obsEl.value = c.observations || '';
      openModal('claim-modal');
    }

    function openView(id) {
      const c = getClaimById(id);
      if (!c) return;
      document.getElementById('view-title').textContent = c.numero;
      document.getElementById('view-body').innerHTML = `
        <div style="display:grid;gap:12px">
          <div><strong>Date du sinistre :</strong> ${formatDate(c.dateSinistre)}</div>
          <div><strong>Date de déclaration :</strong> ${formatDate(c.dateDeclaration)}</div>
          <div><strong>Véhicule :</strong> ${getVehicleLabel(c.vehiculeId)}</div>
          <div><strong>Conducteur :</strong> ${getConducteurName(c.conducteurId)}</div>
          <div><strong>Type :</strong> ${c.type}</div>
          <div><strong>Gravité :</strong> ${c.gravite || '—'}</div>
          <div><strong>Statut :</strong> ${statutBadge(c.statut)}</div>
          <div><strong>Lieu :</strong> ${c.lieu || '—'}</div>
          <div><strong>Description :</strong><br>${c.description || '—'}</div>
          <div><strong>Coût estimé :</strong> ${c.coutEstime ? c.coutEstime.toLocaleString('fr-FR') + ' €' : '—'}</div>
          ${c.observations ? `<div><strong>Observations :</strong><br>${c.observations}</div>` : ''}
        </div>
      `;
      openModal('view-modal');
    }

    function handleSubmit(e) {
      e.preventDefault();
      const data = {
        dateSinistre: document.getElementById('dateSinistre').value,
        type: document.getElementById('type').value,
        vehiculeId: document.getElementById('vehiculeId').value,
        conducteurId: document.getElementById('conducteurId').value,
        lieu: document.getElementById('lieu').value.trim(),
        description: document.getElementById('description').value.trim(),
        gravite: document.getElementById('gravite').value,
        coutEstime: parseFloat(document.getElementById('coutEstime').value) || 0
      };

      if (!isConducteur) {
        const statutEl = document.getElementById('statut');
        if (statutEl) data.statut = statutEl.value;
        const obsEl = document.getElementById('observations');
        if (obsEl) data.observations = obsEl.value.trim();
      }

      try {
        if (editId) {
          updateClaim(editId, data);
          showToast('Sinistre mis à jour.');
        } else {
          addClaim(data);
          showToast('Sinistre déclaré avec succès.');
        }
        closeModal('claim-modal');
        renderClaims();
      } catch (err) {
        showToast(err.message, 'error');
      }
    }

    function confirmDelete(id, numero) {
      if (!confirm("Supprimer le sinistre « " + numero + " » ?")) return;
      try {
        deleteClaim(id);
        showToast('Sinistre supprimé.');
        renderClaims();
      } catch (err) {
        showToast(err.message, 'error');
      }
    }

    renderClaims();
  </script>
</body>
</html>

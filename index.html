<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion — Gestion Sinistres Parc Automobile</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <div class="logo">
        <div class="logo-icon">🚗</div>
        <h1>GSPA</h1>
        <p class="subtitle">Gestion des Sinistres — Parc Automobile</p>
      </div>

      <div class="error-msg" id="error-msg"></div>

      <form id="login-form">
        <div class="form-group">
          <label for="email">Adresse e-mail</label>
          <input type="email" id="email" name="email" required placeholder="ex: admin@parc.local" autocomplete="username">
        </div>
        <div class="form-group">
          <label for="password">Mot de passe</label>
          <input type="password" id="password" name="password" required placeholder="••••••••" autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary">Se connecter</button>
      </form>

      <div class="demo-accounts">
        <h4>Comptes de démonstration</h4>
        <button type="button" class="demo-btn" data-email="admin@parc.local" data-pass="admin123">
          <strong>Admin</strong> — admin@parc.local / admin123
        </button>
        <button type="button" class="demo-btn" data-email="marie.dupont@parc.local" data-pass="gest123">
          <strong>Gestionnaire</strong> — marie.dupont@parc.local / gest123
        </button>
        <button type="button" class="demo-btn" data-email="jean.martin@parc.local" data-pass="cond123">
          <strong>Conducteur</strong> — jean.martin@parc.local / cond123
        </button>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    // Rediriger si déjà connecté
    if (getSession()) {
      window.location.href = 'dashboard.html';
    }

    document.getElementById('login-form').addEventListener('submit', function (e) {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const errorEl = document.getElementById('error-msg');

      const users = getUsers();
      const user = users.find(u => u.email.toLowerCase() === email.toLowerCase() && u.password === password);

      if (!user) {
        errorEl.textContent = 'Email ou mot de passe incorrect.';
        errorEl.style.display = 'block';
        return;
      }

      setSession(user);
      window.location.href = 'dashboard.html';
    });

    document.querySelectorAll('.demo-btn').forEach(btn => {
      btn.addEventListener('click', function () {
        document.getElementById('email').value = this.dataset.email;
        document.getElementById('password').value = this.dataset.pass;
        document.getElementById('error-msg').style.display = 'none';
      });
    });
  </script>
</body>
</html>
